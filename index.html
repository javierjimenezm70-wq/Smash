<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smash Arena</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #1a1a2e, #0f3460); color: white; min-height: 100vh; padding: 15px; }
.container { max-width: 650px; margin: 0 auto; }
h1 { color: #e94560; text-align: center; font-size: 28px; margin-bottom: 5px; text-shadow: 0 0 20px #e94560; }
.estado { text-align: center; color: #ffd700; font-size: 12px; margin-bottom: 15px; }

.admin-bar { text-align: center; margin-bottom: 10px; }
.btn-admin { background: #333; color: #ccc; padding: 8px 15px; border-radius: 20px; font-size: 13px; border: 1px solid #555; cursor: pointer; }
.btn-admin.activo { background: #ffd700; color: #000; border-color: #ffd700; font-weight: bold; box-shadow: 0 0 15px rgba(255,215,0,0.5); }

.salas-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
.btn-sala { padding: 10px 20px; border-radius: 10px; font-weight: bold; border: 2px solid transparent; cursor: pointer; font-size: 14px; background: #16213e; color: #888; }
.btn-sala.activo-live { background: #e94560; color: white; box-shadow: 0 0 10px rgba(233,69,96,0.5); }
.btn-sala.activo-pub { background: #0f6fd4; color: white; box-shadow: 0 0 10px rgba(15,111,212,0.5); }

.tabs-row { display: flex; gap: 5px; margin-bottom: 20px; background: #16213e; padding: 5px; border-radius: 12px; }
.tab { flex: 1; padding: 12px; border: none; background: transparent; color: #888; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; }
.tab.activo { background: #e94560; color: white; }
.btn-sesion { background: #0f6fd4; color: white; border: none; padding: 12px 15px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
.btn-sesion:disabled { opacity: 0.5; cursor: not-allowed; }

.modo-switch { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
.modo-btn { background: #16213e; color: #888; padding: 8px 15px; border: 2px solid #16213e; font-size: 14px; border-radius: 10px; cursor: pointer; font-weight: bold; }
.modo-btn.activo { background: #e94560; color: white; border-color: #e94560; }
.btn-puntos { background: #28a745; color: white; border-color: #28a745; }
.btn-puntos.off { background: #555; color: #ccc; border-color: #555; }

.card { background: rgba(22, 33, 62, 0.9); border-radius: 15px; padding: 18px; margin-bottom: 15px; border: 2px solid #16213e; }
.add-form { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
input { flex: 1; min-width: 150px; padding: 12px; font-size: 15px; border-radius: 10px; border: 2px solid #e94560; background: #0f3460; color: white; outline: none; }
input::placeholder { color: #888; }
button { padding: 12px 18px; font-size: 15px; border-radius: 10px; border: none; background: #e94560; color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
button:disabled { background: #555; cursor: not-allowed; color: #888; }
h2 { color: #e94560; font-size: 16px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
.vs-1v1 { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 15px 0; flex-wrap: wrap; }
.jugador-actual { background: #e94560; padding: 12px 18px; border-radius: 10px; min-width: 110px; font-size: 18px; font-weight: bold; text-align: center; }
.jugador-actual .pts-mini { display: block; font-size: 11px; opacity: 0.85; margin-top: 4px; font-weight: normal; }
.vs-texto { color: #ffd700; font-size: 24px; font-weight: bold; }
.equipos-2v2 { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 15px 0; flex-wrap: wrap; }
.equipo { padding: 12px; border-radius: 12px; min-width: 150px; flex: 1; max-width: 200px; text-align: center; }
.equipo-rojo { background: linear-gradient(135deg, #e94560, #b8273f); }
.equipo-azul { background: linear-gradient(135deg, #0f6fd4, #0a4d94); }
.equipo-titulo { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.9; margin-bottom: 6px; }
.equipo-jugadores { font-size: 15px; font-weight: bold; line-height: 1.6; }
.etiqueta { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; display: block; margin-bottom: 4px; }
.botones-ganador { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.btn-ganador { background: #28a745; padding: 10px 15px; font-size: 14px; }
.btn-ganador.rojo { background: #c72a45; }
.btn-ganador.azul { background: #0a4d94; }
.jugador { background: #0f3460; padding: 10px 12px; margin: 6px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; border-left: 4px solid #e94560; }
.jugador.nuevo { border-left-color: #ffd700; background: #1a3a60; }
.jugador-info { display: flex; align-items: center; gap: 8px; flex: 1; }
.badge { background: #ffd700; color: #1a1a2e; padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: bold; }
.numero { color: #e94560; font-weight: bold; min-width: 18px; }
.btn-quitar { background: #dc3545; padding: 5px 9px; font-size: 13px; }
.vacio { text-align: center; color: #666; padding: 18px; font-style: italic; }
.btn-reset { background: #444; width: 100%; margin-top: 10px; }

/* NUEVO: Botón de copiar al chat */
.btn-copiar { background: #7289da; width: 100%; margin-top: 10px; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 8px;}
.btn-copiar:hover { background: #5b6eae; }

.info-jugadores { text-align: center; color: #888; font-size: 12px; margin-bottom: 12px; }

.top-item { display: flex; align-items: center; gap: 10px; padding: 12px; margin: 8px 0; background: #0f3460; border-radius: 10px; border-left: 4px solid #e94560; }
.top-item.p1 { background: linear-gradient(135deg, #3a2500, #5a3a00); border-left-color: #ffd700; }
.top-item.p2 { background: linear-gradient(135deg, #2a2a2a, #3a3a3a); border-left-color: #c0c0c0; }
.top-item.p3 { background: linear-gradient(135deg, #3a1e0a, #5a2e12); border-left-color: #cd7f32; }
.top-pos { font-size: 20px; font-weight: bold; min-width: 40px; text-align: center; }
.top-info { flex: 1; }
.top-nombre { font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 5px;}
.top-stats { font-size: 12px; color: #aaa; margin-top: 2px; }
.top-puntos { font-size: 18px; font-weight: bold; color: #ffd700; text-align: right; }
.top-acciones { display: flex; gap: 4px; margin-left: 8px; }
.btn-mini { padding: 5px 8px; font-size: 12px; border-radius: 6px; }
.btn-edit { background: #0f6fd4; }
.btn-del { background: #dc3545; }
.oculto { display: none; }
.racha { color: #ff9800; font-size: 13px; font-weight: bold; margin-left: 5px; text-shadow: 0 0 10px rgba(255,152,0,0.5);}

.hist-item { font-size: 13px; padding: 8px; background: #0f3460; margin-bottom: 5px; border-radius: 8px; border-left: 3px solid #28a745; }
.hist-ganador { color: #28a745; font-weight: bold; }
.hist-perdedor { color: #ff6b6b; }

.pantalla-resultado { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 10, 20, 0.95); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.pantalla-resultado.mostrar { opacity: 1; pointer-events: auto; }
.resultado-card { background: linear-gradient(135deg, #16213e, #0f3460); border: 3px solid #ffd700; border-radius: 20px; padding: 30px 25px; max-width: 500px; width: 100%; text-align: center; }
.resultado-titulo { font-size: 26px; font-weight: bold; color: #ffd700; margin-bottom: 25px; }
.resultado-jugador { background: #0a1a30; border-radius: 12px; padding: 15px; margin: 10px 0; text-align: left; }
.resultado-jugador.ganador { border: 2px solid #28a745; background: linear-gradient(135deg, #0a3a1a, #0a1a30); }
.resultado-jugador.perdedor { border: 2px solid #dc3545; background: linear-gradient(135deg, #3a0a0a, #0a1a30); }
.resultado-nombre { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
.resultado-ganador .resultado-nombre { color: #28a745; }
.resultado-perdedor .resultado-nombre { color: #ff6b6b; }
.resultado-puntos { font-size: 16px; }
.puntos-antes { color: #888; }
.puntos-flecha { color: #ffd700; font-size: 18px; }
.puntos-despues { color: #fff; font-weight: bold; font-size: 20px; }
.puntos-cambio { font-size: 14px; font-weight: bold; margin-left: 10px; }
.puntos-cambio.positivo { color: #28a745; }
.puntos-cambio.negativo { color: #ff6b6b; }
.resultado-info { font-size: 13px; color: #aaa; margin-top: 20px; font-style: italic; }
.btn-continuar { background: #28a745; padding: 15px 40px; font-size: 17px; margin-top: 25px; border-radius: 12px; }
.modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10, 10, 20, 0.9); z-index: 400; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal.mostrar { display: flex; }
.modal-card { background: linear-gradient(135deg, #16213e, #0f3460); border: 3px solid #0f6fd4; border-radius: 20px; padding: 30px 25px; max-width: 450px; width: 100%; text-align: center; }
.modal-titulo { font-size: 24px; font-weight: bold; color: #0f6fd4; margin-bottom: 15px; }
.modal-lista { background: #0a1a30; border-radius: 10px; padding: 15px; margin: 15px 0; text-align: left; font-size: 14px; line-height: 1.8; }
.modal-botones { display: flex; gap: 10px; margin-top: 20px; }
.modal-botones button { flex: 1; }
.btn-cancelar { background: #666; }
.btn-confirmar { background: #0f6fd4; }
</style>
</head>
<body>
<div class="container">
  <h1>🎮 SMASH ARENA</h1>
  <div class="estado" id="estado">🔄 Conectando...</div>
  
  <div class="admin-bar">
    <button class="btn-admin" id="btnAdmin" onclick="toggleAdmin()">🔒 Modo Espectador (Toca para Admin)</button>
  </div>

  <div class="salas-bar">
    <button class="btn-sala activo-live" id="btnSalaLive" onclick="cambiarSala('live')">🔴 SALA LIVE</button>
    <button class="btn-sala" id="btnSalaPub" onclick="cambiarSala('publica')">🔵 SALA PÚBLICA</button>
  </div>

  <div class="tabs-row">
    <button class="tab activo" id="tabCola" onclick="cambiarTab('cola')">📋 Cola</button>
    <button class="tab" id="tabTop" onclick="cambiarTab('top')">🏆 Top</button>
    <button class="btn-sesion" id="btnTerminar" onclick="abrirModalSesion()" disabled>🌙 Terminar</button>
  </div>

  <div id="seccionCola">
    <div class="modo-switch">
      <button class="modo-btn activo" id="btn1v1" onclick="cambiarModo('1v1')" disabled>1 vs 1</button>
      <button class="modo-btn" id="btn2v2" onclick="cambiarModo('2v2')" disabled>2 vs 2</button>
      <button class="modo-btn btn-puntos" id="btnPuntos" onclick="togglePuntos()" disabled>🔴 Puntos ON</button>
    </div>
    
    <div class="info-jugadores" id="infoJugadores"></div>
    
    <div class="add-form" id="formAgregar" style="display:none;">
      <input id="nombre" placeholder="Nombre del jugador..." onkeypress="if(event.key==='Enter') agregar()">
      <button onclick="agregar()">➕ Agregar</button>
    </div>
    
    <div class="card" id="partidaActual"></div>
    
    <div class="card">
      <h2>⏳ En cola</h2>
      <div id="lista"></div>
      <!-- NUEVO BOTÓN DE COPIAR -->
      <button class="btn-copiar" id="btnCopiar" onclick="copiarSiguientes()" style="display:none;">📋 Copiar siguientes 4 al chat</button>
      <button class="btn-reset" id="btnReset" onclick="resetFila()" style="display:none;">🔄 Reiniciar fila</button>
    </div>

    <div class="card" id="cardHistorial">
      <h2>📜 Últimas partidas</h2>
      <div id="historial"></div>
    </div>
  </div>

  <div id="seccionTop" class="oculto">
    <div class="add-form" id="formTop" style="display:none;">
      <input id="nuevoTop" placeholder="Nombre para el top..." onkeypress="if(event.key==='Enter') agregarAlTop()">
      <button onclick="agregarAlTop()">➕ Agregar al top</button>
    </div>
    <div class="card">
      <h2>🏆 Top Mundial</h2>
      <div id="listaTop"></div>
    </div>
  </div>
</div>

<div class="pantalla-resultado" id="pantallaResultado">
  <div class="resultado-card">
    <div class="resultado-titulo">🏆 GANÓ <span id="nombreGanador"></span></div>
    <div id="resultadoCuerpo"></div>
    <div class="resultado-info" id="resultadoInfo"></div>
    <button class="btn-continuar" onclick="continuarPartida()">▶️ Continuar</button>
  </div>
</div>

<div class="modal" id="modalSesion">
  <div class="modal-card">
    <div class="modal-titulo">🌙 Terminar sesión Live</div>
    <div class="modal-lista">
      <div>✅ Se borrará la <b>fila de la Sala LIVE</b></div>
      <div>✅ Se borrará el <b>historial de partidas Live</b></div>
      <div style="color:#ffd700; margin-top:8px;">🏆 El <b>Top Mundial y la Sala Pública se mantienen</b></div>
    </div>
    <div class="modal-botones">
      <button class="btn-cancelar" onclick="cerrarModalSesion()">Cancelar</button>
      <button class="btn-confirmar" onclick="confirmarTerminarSesion()">Sí, terminar</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBt3R-IcIFnB0YrqhaG1yAg6E2NQTWL5l8",
  authDomain: "smash-arena-5ae7d.firebaseapp.com",
  projectId: "smash-arena-5ae7d",
  storageBucket: "smash-arena-5ae7d.firebasestorage.app",
  messagingSenderId: "695876993359",
  appId: "1:695876993359:web:7d1f5c87fc8e752fa8c53a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const PASSWORDS = ["Danonino", "Green princes", "El crak", "👑 Green princes 👑"];

let ranking = {}; 
let esAdmin = false;
let salaActual = 'live'; 
let cargando = true;

let salas = {
  live: { fila: [], yaJugaron: [], modo: '1v1', puntosActivos: true, historial: [] },
  publica: { fila: [], yaJugaron: [], modo: '1v1', puntosActivos: false, historial: [] }
};

async function guardarFirebase() {
  try {
    await setDoc(doc(db, "app", "datos"), {
      ranking: ranking,
      salas: salas,
      ultimaActualizacion: Date.now()
    });
  } catch(e) {
    console.error("Error guardando:", e);
  }
}

function escucharFirebase() {
  onSnapshot(doc(db, "app", "datos"), (docSnap) => {
    if (docSnap.exists()) {
      const data = docSnap.data();
      ranking = data.ranking || {};
      if (data.salas) salas = data.salas;
      cargando = false;
      document.getElementById('estado').textContent = '🟢 Conectado - Top mundial en vivo';
      render();
    } else {
      guardarFirebase();
    }
  });
}

function toggleAdmin() {
  if (esAdmin) {
    esAdmin = false;
    document.getElementById('btnAdmin').className = 'btn-admin';
    document.getElementById('btnAdmin').textContent = '🔒 Modo Espectador (Toca para Admin)';
  } else {
    const pass = prompt("Ingresa la contraseña de Admin:");
    if (pass !== null && PASSWORDS.includes(pass)) {
      esAdmin = true;
      document.getElementById('btnAdmin').className = 'btn-admin activo';
      document.getElementById('btnAdmin').textContent = '👑 Eres el Admin';
      alert("¡Bienvenido, Crak! Tienes el control total.");
    } else if (pass !== null) {
      alert("Contraseña incorrecta.");
    }
  }
  render();
}

function cambiarSala(nuevaSala) { salaActual = nuevaSala; render(); }

function togglePuntos() {
  if (!esAdmin) return;
  salas[salaActual].puntosActivos = !salas[salaActual].puntosActivos;
  guardarFirebase();
}

function cambiarModo(nuevo) {
  if (!esAdmin) return;
  salas[salaActual].modo = nuevo;
  guardarFirebase();
}

function cambiarTab(tab) {
  document.getElementById('tabCola').classList.toggle('activo', tab === 'cola');
  document.getElementById('tabTop').classList.toggle('activo', tab === 'top');
  document.getElementById('seccionCola').classList.toggle('oculto', tab !== 'cola');
  document.getElementById('seccionTop').classList.toggle('oculto', tab !== 'top');
  render();
}

function jugadoresPorPartida() { return salas[salaActual].modo === '1v1' ? 2 : 4; }

function obtenerPuntos(nombre) {
  if (!ranking[nombre]) ranking[nombre] = { puntos: 300, victorias: 0, derrotas: 0, racha: 0 };
  if (ranking[nombre].racha === undefined) ranking[nombre].racha = 0;
  return ranking[nombre].puntos;
}

function calcularRobo(pG, pP) {
  const dif = Math.abs(pP - pG);
  if (dif === 0) return Math.round(pP * 0.20);
  if (pG < pP) return Math.round(dif * 0.50);
  return Math.round(dif * 0.05);
}

async function agregar() {
  if (!esAdmin) return;
  const input = document.getElementById('nombre');
  const nombre = input.value.trim();
  if (!nombre) return;
  
  const s = salas[salaActual];
  if (s.fila.includes(nombre)) { alert(`${nombre} ya está en esta fila`); return; }
  if (!ranking[nombre]) ranking[nombre] = { puntos: 300, victorias: 0, derrotas: 0, racha: 0 };

  const esNuevo = !s.yaJugaron.includes(nombre);
  const enJuego = jugadoresPorPartida();

  if (esNuevo) {
    if (s.fila.length <= enJuego) s.fila.push(nombre);
    else s.fila.splice(enJuego, 0, nombre);
  } else {
    s.fila.push(nombre);
  }

  input.value = '';
  input.focus();
  await guardarFirebase();
}

async function agregarAlTop() {
  if (!esAdmin) return;
  const input = document.getElementById('nuevoTop');
  const nombre = input.value.trim();
  if (!nombre) return;
  if (ranking[nombre]) { alert(`${nombre} ya está en el top`); return; }
  ranking[nombre] = { puntos: 300, victorias: 0, derrotas: 0, racha: 0 };
  input.value = '';
  await guardarFirebase();
}

// 🚀 NUEVA FUNCIÓN PARA COPIAR AL CHAT
function copiarSiguientes() {
  const s = salas[salaActual];
  const enJuego = jugadoresPorPartida();
  const enEspera = s.fila.slice(enJuego); // Agarramos a los que están en cola
  
  if (enEspera.length === 0) {
    alert("No hay nadie en la fila para copiar.");
    return;
  }

  // Agarra los siguientes 4 (o los que queden si hay menos de 4)
  const siguientes = enEspera.slice(0, 4);
  
  let texto = "📋 SIGUIENTES EN FILA:\n";
  siguientes.forEach((nombre, i) => {
    texto += `${i + 1}. ${nombre}\n`;
  });

  // Copiar al portapapeles
  navigator.clipboard.writeText(texto).then(() => {
    alert("¡Copiado! Solo abre el chat de tu live y dale a Pegar.");
  }).catch(err => {
    // Si el celular no deja copiar directo, mostramos el texto para copiar manual
    prompt("Copia este texto manualmente:", texto);
  });
}

function render() {
  if (cargando) return;
  
  document.getElementById('btnSalaLive').className = 'btn-sala ' + (salaActual === 'live' ? 'activo-live' : '');
  document.getElementById('btnSalaPub').className = 'btn-sala ' + (salaActual === 'publica' ? 'activo-pub' : '');
  
  document.getElementById('formAgregar').style.display = esAdmin ? 'flex' : 'none';
  document.getElementById('formTop').style.display = esAdmin ? 'flex' : 'none';
  document.getElementById('btnReset').style.display = esAdmin ? 'block' : 'none';
  document.getElementById('btnCopiar').style.display = esAdmin ? 'flex' : 'none'; // Mostrar botón copiar solo a admins
  document.getElementById('cardHistorial').style.display = esAdmin ? 'block' : 'none';
  
  document.getElementById('btn1v1').disabled = !esAdmin;
  document.getElementById('btn2v2').disabled = !esAdmin;
  document.getElementById('btnPuntos').disabled = !esAdmin;
  
  const s = salas[salaActual];
  document.getElementById('btn1v1').classList.toggle('activo', s.modo === '1v1');
  document.getElementById('btn2v2').classList.toggle('activo', s.modo === '2v2');
  
  const btnPts = document.getElementById('btnPuntos');
  if (s.puntosActivos) {
    btnPts.className = 'modo-btn btn-puntos activo';
    btnPts.textContent = '🔴 Puntos ON';
  } else {
    btnPts.className = 'modo-btn btn-puntos off';
    btnPts.textContent = '⚪ Puntos OFF';
  }

  if (!document.getElementById('seccionCola').classList.contains('oculto')) {
    renderCola();
  } else {
    renderTop();
  }
}

function renderCola() {
  document.getElementById('infoJugadores').textContent = `📊 ${Object.keys(ranking).length} jugadores en el top mundial`;
  renderPartida();
  renderListaCola();
  renderHistorial();
}

function renderPartida() {
  const div = document.getElementById('partidaActual');
  const s = salas[salaActual];
  const enJuego = jugadoresPorPartida();

  if (s.fila.length < enJuego) {
    div.innerHTML = `<h2>🎯 Partida actual (${s.modo})</h2><div class="vacio">Faltan jugadores: ${s.fila.length}/${enJuego}</div>`;
    return;
  }

  if (s.modo === '1v1') {
    const j1 = s.fila[0], j2 = s.fila[1];
    const p1 = obtenerPuntos(j1), p2 = obtenerPuntos(j2);
    div.innerHTML = `
      <h2>🎯 Partida actual (1v1)</h2>
      <div class="vs-1v1">
        <div class="jugador-actual"><span class="etiqueta">Jugador 1</span>${j1}<span class="pts-mini">${p1} pts</span></div>
        <span class="vs-texto">VS</span>
        <div class="jugador-actual"><span class="etiqueta">Jugador 2</span>${j2}<span class="pts-mini">${p2} pts</span></div>
      </div>
      ${esAdmin ? `
      <p style="color:#aaa; margin-top:10px; text-align:center;">¿Quién ganó?</p>
      <div class="botones-ganador">
        <button class="btn-ganador" onclick="ganador1v1(0)">🏆 ${j1}</button>
        <button class="btn-ganador" onclick="ganador1v1(1)">🏆 ${j2}</button>
      </div>` : `<p style="color:#888; text-align:center; margin-top:10px;">🔒 Esperando al Admin...</p>`}
    `;
  } else {
    const r1 = s.fila[0], a1 = s.fila[1], r2 = s.fila[2], a2 = s.fila[3];
    div.innerHTML = `
      <h2>🎯 Partida actual (2v2)</h2>
      <div class="equipos-2v2">
        <div class="equipo equipo-rojo"><div class="equipo-titulo">🔴 Rojo</div><div class="equipo-jugadores">${r1}<br>${r2}</div></div>
        <span class="vs-texto">VS</span>
        <div class="equipo equipo-azul"><div class="equipo-titulo">🔵 Azul</div><div class="equipo-jugadores">${a1}<br>${a2}</div></div>
      </div>
      ${esAdmin ? `
      <p style="color:#aaa; margin-top:10px; text-align:center;">¿Qué equipo ganó?</p>
      <div class="botones-ganador">
        <button class="btn-ganador rojo" onclick="ganador2v2('rojo')">🏆 Rojo</button>
        <button class="btn-ganador azul" onclick="ganador2v2('azul')">🏆 Azul</button>
      </div>` : `<p style="color:#888; text-align:center; margin-top:10px;">🔒 Esperando al Admin...</p>`}
    `;
  }
}

function renderListaCola() {
  const lista = document.getElementById('lista');
  const s = salas[salaActual];
  const enJuego = jugadoresPorPartida();
  const enEspera = s.fila.slice(enJuego);
  
  if (enEspera.length === 0) { lista.innerHTML = '<div class="vacio">No hay nadie esperando</div>'; return; }
  
  lista.innerHTML = enEspera.map((j, i) => {
    const esNuevo = !s.yaJugaron.includes(j);
    const posReal = i + enJuego + 1;
    let ind = '';
    if (s.modo === '2v2') {
      ind = posReal % 2 === 1 ? '<span style="color:#e94560; font-size:11px;">🔴</span>' : '<span style="color:#0f6fd4; font-size:11px;">🔵</span>';
    }
    return `
      <div class="jugador ${esNuevo ? 'nuevo' : ''}">
        <div class="jugador-info">
          <span class="numero">${i + 1}.</span>${ind}<span>${j}</span>
          ${esNuevo ? '<span class="badge">NUEVO</span>' : ''}
        </div>
        ${esAdmin ? `<button class="btn-quitar" onclick="quitar('${j.replace(/'/g, "\\'")}')">❌</button>` : ''}
      </div>
    `;
  }).join('');
}

function renderHistorial() {
  const div = document.getElementById('historial');
  const h = salas[salaActual].historial;
  if (!h || h.length === 0) { div.innerHTML = '<div class="vacio">Aún no hay partidas</div>'; return; }
  div.innerHTML = h.map(item => `
    <div class="hist-item">
      <span class="hist-ganador">🏆 ${item.ganador}</span> venció a <span class="hist-perdedor">${item.perdedor}</span>
      ${item.robo > 0 ? `<span style="color:#888; float:right;">(${item.robo} pts)</span>` : '<span style="color:#888; float:right;">(Casual)</span>'}
    </div>
  `).join('');
}

function ganador1v1(indice) {
  if (!esAdmin) return;
  const s = salas[salaActual];
  const gN = s.fila[indice];
  const pN = s.fila[1 - indice];
  let antesG = 0, antesP = 0, robo = 0;

  if (s.puntosActivos) {
    if (!ranking[gN]) ranking[gN] = { puntos: 300, victorias: 0, derrotas: 0, racha: 0 };
    if (!ranking[pN]) ranking[pN] = { puntos: 300, victorias: 0, derrotas: 0, racha: 0 };
    antesG = ranking[gN].puntos; antesP = ranking[pN].puntos;
    robo = calcularRobo(antesG, antesP);
    ranking[gN].puntos += robo;
    ranking[pN].puntos = Math.max(0, ranking[pN].puntos - robo);
    ranking[gN].victorias += 1; ranking[pN].derrotas += 1;
    ranking[gN].racha += 1; ranking[pN].racha = 0;
    
    s.historial.unshift({ ganador: gN, perdedor: pN, robo: robo, fecha: Date.now() });
    if (s.historial.length > 10) s.historial.pop();
  } else {
    s.historial.unshift({ ganador: gN, perdedor: pN, robo: 0, fecha: Date.now() });
    if (s.historial.length > 10) s.historial.pop();
  }

  s.fila.splice(0, 2); s.fila.unshift(gN); s.fila.push(pN);
  if (!s.yaJugaron.includes(gN)) s.yaJugaron.push(gN);
  if (!s.yaJugaron.includes(pN)) s.yaJugaron.push(pN);

  guardarFirebase();

  if (s.puntosActivos) {
    mostrarResultado(gN, pN, antesG, antesG + robo, antesP, Math.max(0, antesP - robo), robo);
  } else {
    mostrarResultadoCasual(gN, pN);
  }
}

async function ganador2v2(eq) {
  if (!esAdmin) return;
  const s = salas[salaActual];
  let ganadores, perdedores;

  if (eq === 'rojo') { 
    ganadores = [s.fila[0], s.fila[2]]; 
    perdedores = [s.fila[1], s.fila[3]]; 
  } else { 
    ganadores = [s.fila[1], s.fila[3]]; 
    perdedores = [s.fila[0], s.fila[2]]; 
  }

  s.fila.splice(0, 4);
  const siguiente1 = s.fila.shift();
  const siguiente2 = s.fila.shift();

  if (eq === 'rojo') {
    s.fila.unshift(siguiente2); 
    s.fila.unshift(ganadores[1]); 
    s.fila.unshift(siguiente1); 
    s.fila.unshift(ganadores[0]); 
  } else {
    s.fila.unshift(ganadores[1]); 
    s.fila.unshift(siguiente2); 
    s.fila.unshift(ganadores[0]); 
    s.fila.unshift(siguiente1); 
  }

  s.fila.push(perdedores[0]);
  s.fila.push(perdedores[1]);

  [...ganadores, ...perdedores].forEach(n => { 
    if (!s.yaJugaron.includes(n)) s.yaJugaron.push(n); 
  });
  
  guardarFirebase();
  render();
}

function mostrarResultado(g, p, aG, dG, aP, dP, robo) {
  document.getElementById('nombreGanador').textContent = g;
  const cG = dG - aG, cP = dP - aP;
  const info = robo === 0 ? '🤝 Nadie roba' : `💰 Se robaron ${robo} pts`;
  document.getElementById('resultadoCuerpo').innerHTML = `
    <div class="resultado-jugador ganador resultado-ganador">
      <div class="resultado-nombre">🏆 ${g}</div>
      <div class="resultado-puntos">
        <span class="puntos-antes">${aG}</span> <span class="puntos-flecha">→</span> <span class="puntos-despues">${dG}</span>
        <span class="puntos-cambio positivo">(+${cG})</span>
      </div>
    </div>
    <div class="resultado-jugador perdedor resultado-perdedor">
      <div class="resultado-nombre">😢 ${p}</div>
      <div class="resultado-puntos">
        <span class="puntos-antes">${aP}</span> <span class="puntos-flecha">→</span> <span class="puntos-despues">${dP}</span>
        <span class="puntos-cambio negativo">(${cP})</span>
      </div>
    </div>
  `;
  document.getElementById('resultadoInfo').textContent = info;
  document.getElementById('pantallaResultado').classList.add('mostrar');
}

function mostrarResultadoCasual(g, p) {
  document.getElementById('nombreGanador').textContent = g;
  document.getElementById('resultadoCuerpo').innerHTML = `
    <div class="resultado-jugador ganador resultado-ganador"><div class="resultado-nombre">🏆 ${g}</div><div style="color:#aaa; font-size:13px; margin-top:5px;">Victoria casual</div></div>
    <div class="resultado-jugador perdedor resultado-perdedor"><div class="resultado-nombre">😢 ${p}</div><div style="color:#aaa; font-size:13px; margin-top:5px;">Derrota casual</div></div>
  `;
  document.getElementById('resultadoInfo').textContent = "⚪ Modo Casual: No se alteraron los puntos.";
  document.getElementById('pantallaResultado').classList.add('mostrar');
}

function continuarPartida() {
  document.getElementById('pantallaResultado').classList.remove('mostrar');
  render();
}

async function quitar(nombre) {
  if (!esAdmin) return;
  if (confirm(`¿Quitar a ${nombre}?`)) {
    salas[salaActual].fila = salas[salaActual].fila.filter(n => n !== nombre);
    await guardarFirebase();
  }
}

async function resetFila() {
  if (!esAdmin) return;
  if (confirm('¿Borrar la fila actual de esta sala?')) {
    salas[salaActual].fila = [];
    await guardarFirebase();
  }
}

function renderTop() {
  const cont = document.getElementById('listaTop');
  const jugs = Object.keys(ranking).map(n => ({ nombre: n, ...ranking[n] })).sort((a, b) => b.puntos - a.puntos);
  if (jugs.length === 0) { cont.innerHTML = '<div class="vacio">No hay jugadores</div>'; return; }
  cont.innerHTML = jugs.map((j, i) => {
    const pos = i + 1;
    let med = '', cls = '';
    if (pos === 1) { med = '🥇'; cls = 'p1'; }
    else if (pos === 2) { med = '🥈'; cls = 'p2'; }
    else if (pos === 3) { med = '🥉'; cls = 'p3'; }
    else { med = `${pos}.`; }
    
    let rachaHTML = '';
    if (j.racha >= 2) rachaHTML = `<span class="racha">🔥 x${j.racha}</span>`;

    return `
      <div class="top-item ${cls}">
        <div class="top-pos">${med}</div>
        <div class="top-info">
          <div class="top-nombre">${j.nombre} ${rachaHTML}</div>
          <div class="top-stats">${j.victorias}V - ${j.derrotas}D</div>
        </div>
        <div class="top-puntos">${j.puntos} pts</div>
        ${esAdmin ? `
        <div class="top-acciones">
          <button class="btn-mini btn-edit" onclick="editarJugador('${j.nombre.replace(/'/g, "\\'")}')">✏️</button>
          <button class="btn-mini btn-del" onclick="eliminarDelTop('${j.nombre.replace(/'/g, "\\'")}')">🗑️</button>
        </div>` : ''}
      </div>
    `;
  }).join('');
}

async function editarJugador(nombre) {
  if (!esAdmin) return;
  const j = ranking[nombre];
  if (!j) return;
  const np = prompt(`Puntos de ${nombre}:`, j.puntos);
  if (np === null) return;
  const p = parseInt(np);
  if (isNaN(p) || p < 0) { alert('Inválido'); return; }
  ranking[nombre].puntos = p;
  await guardarFirebase();
}

async function eliminarDelTop(nombre) {
  if (!esAdmin) return;
  if (confirm(`¿Eliminar a ${nombre} del top?`)) {
    delete ranking[nombre];
    salas.live.fila = salas.live.fila.filter(n => n !== nombre);
    salas.publica.fila = salas.publica.fila.filter(n => n !== nombre);
    salas.live.yaJugaron = salas.live.yaJugaron.filter(n => n !== nombre);
    salas.publica.yaJugaron = salas.publica.yaJugaron.filter(n => n !== nombre);
    await guardarFirebase();
  }
}

function abrirModalSesion() { if (!esAdmin) return; document.getElementById('modalSesion').classList.add('mostrar'); }
function cerrarModalSesion() { document.getElementById('modalSesion').classList.remove('mostrar'); }
async function confirmarTerminarSesion() {
  if (!esAdmin) return;
  salas.live.fila = [];
  salas.live.yaJugaron = [];
  salas.live.historial = []; 
  await guardarFirebase();
  cerrarModalSesion();
  alert('✅ Sesión Live terminada\n🎮 Tu fila está vacía\n🏆 Top y Sala Pública mantenidos');
}

window.cambiarSala = cambiarSala;

window.cambiarTab = cambiarTab;

window.agregar = agregar;
window.agregarAlTop = agregarAlTop;
window.copiarSiguientes = copiarSiguientes;
window.ganador1v1 = ganador1v1;
window.ganador2v2 = ganador2v2;
window.continuarPartida = continuarPartida;
window.quitar = quitar;
window.resetFila = resetFila;
window.editarJugador = editarJugador;
window.eliminarDelTop = eliminarDelTop;
window.abrirModalSesion = abrirModalSesion;
window.cerrarModalSesion = cerrarModalSesion;
window.confirmarTerminarSesion = confirmarTerminarSesion;
</script>
